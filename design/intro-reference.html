body{margin:0;font-family:'Barlow',system-ui,sans-serif}

body{margin:0;font-family:'Barlow',system-ui,sans-serif}
.scene{animation:sceneFade 8s linear infinite}
.ball{transform-box:fill-box;transform-origin:center}
.rest{animation:restBall 8s cubic-bezier(0.1,0.7,0.3,1) infinite}
.near{animation:potNear 8s cubic-bezier(0.2,0.6,0.4,1) infinite}
.far{animation:potFar 8s cubic-bezier(0.2,0.6,0.4,1) infinite}
.cue{animation:cueRoll 8s linear infinite}
.stick{animation:stickHit 8s ease-in infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ringPop 8s ease-out infinite}
.splash{animation:splashIn 8s ease-in-out infinite}
.app{animation:appIn 8s ease-in-out infinite}
@keyframes sceneFade{0%{opacity:0}2.7%{opacity:1}16.875%{opacity:1}20%,100%{opacity:0}}
@keyframes stickHit{0%{transform:translateY(46px);opacity:0}1.8%{transform:translateY(46px);opacity:1}4.5%{transform:translateY(2px);opacity:1}7.2%{transform:translateY(-18px);opacity:1}9.9%,100%{transform:translateY(-18px);opacity:0}}
@keyframes cueRoll{0%,4.5%{transform:translate(0px,0px);animation-timing-function:ease-in}8.55%{transform:translate(15px,-271px);animation-timing-function:ease-out}18%,100%{transform:translate(17px,-293px)}}
@keyframes ringPop{0%,8.55%{opacity:0;transform:scale(0.4)}9%{opacity:0.8;transform:scale(0.6)}12.15%,100%{opacity:0;transform:scale(2.4)}}
@keyframes restBall{0%,8.55%{transform:translate(0px,0px)}16.2%,100%{transform:translate(var(--dx),var(--dy))}}
@keyframes potNear{0%,8.55%{transform:translate(0px,0px) scale(1);opacity:1}12.15%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:1}13.5%,100%{transform:translate(var(--dx),var(--dy)) scale(0.5);opacity:0}}
@keyframes potFar{0%,8.55%{transform:translate(0px,0px) scale(1);opacity:1}14.4%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:1}15.75%,100%{transform:translate(var(--dx),var(--dy)) scale(0.5);opacity:0}}
@keyframes splashIn{0%,20%{opacity:0}23.125%{opacity:1}31.25%{opacity:1}34.375%,100%{opacity:0}}
@keyframes appIn{0%,34.375%{opacity:0}37.5%{opacity:1}92.5%{opacity:1}97.5%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
.scene,.splash{animation:none;opacity:0}
.app{animation:none;opacity:1}
}
